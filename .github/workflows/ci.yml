name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a superseded run when new commits land on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The app never connects during `next build` — pages that read the DB
          # are force-dynamic — but PrismaClient is constructed on import and
          # Auth.js wants a secret. Dummy values are fine for a build.
          DATABASE_URL: postgresql://user:password@localhost:5432/db
          DIRECT_URL: postgresql://user:password@localhost:5432/db
          AUTH_SECRET: build-only-placeholder-secret-not-used-at-runtime
